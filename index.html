<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <title>Daily Work Tracker Pro</title>
  <meta name="description" content="Enterprise employee daily activity and productivity management system">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Cpath d='M18 34l10 10 18-20' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Login screen -->
  <div id="login-view" class="login-wrap d-none"></div>

  <!-- Application shell -->
  <div id="app-shell" class="app-shell d-none">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><i class="bi bi-check2-square"></i></div>
        <div>
          <div class="brand-name">Daily Work Tracker</div>
          <div class="brand-sub">PRO · <span id="brand-company">Oakcraft Furniture</span></div>
        </div>
        <button class="btn-close btn-close-white d-lg-none ms-auto" id="sidebar-close" aria-label="Close menu"></button>
      </div>
      <nav id="main-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip" id="sidebar-user"></div>
        <button class="btn btn-sm btn-outline-light w-100 mt-2" id="btn-logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="main-area">
      <header class="topbar">
        <button class="btn btn-light d-lg-none me-2" id="sidebar-toggle" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-right">
          <span class="demo-pill d-none" id="demo-pill" title="Running with in-browser sample data. Configure API_URL in js/config.js to connect to Google Apps Script."><i class="bi bi-flask"></i> Demo mode</span>
          <span class="topbar-date" id="topbar-date"></span>
          <span class="running-timer d-none" id="topbar-timer" title="A task timer is running"><i class="bi bi-stopwatch"></i> <span></span></span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- Global loader & toasts -->
  <div id="global-loader" class="global-loader d-none"><div class="spinner-border text-primary" role="status"></div></div>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 2000"></div>
  <div id="modal-host"></div>

  <!-- Printable report container (filled at print time) -->
  <div id="print-area" class="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/questionnaire.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/settings.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { App.init(); });</script>
</body>
</html>
